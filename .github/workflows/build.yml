name: Build PS4 SPRX

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl tar binutils

      - name: Download OpenOrbis SDK (Linux)
        run: |
          mkdir -p $HOME/OO_PS4_TOOLCHAIN
          cd $HOME/OO_PS4_TOOLCHAIN
          URL=$(curl -sL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | grep browser_download_url | grep -E '\.tar\.gz' | head -n 1 | cut -d '"' -f 4)
          [ -n "$URL" ] || { echo "Aucune archive .tar.gz trouvee"; exit 1; }
          curl -sL "$URL" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz
          ROOT=$(dirname "$(find $PWD -type f -name link.x | head -n 1)")
          chmod +x "$ROOT"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV

      - name: Build SPRX
        run: make

      - name: Preparer le fichier .prx
        run: cp mc_lan_proxy.sprx mc_lan_proxy.prx

      - name: Publier la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest mc_lan_proxy.prx \
            --title "Dernier build" \
            --notes "Build automatique du commit $GITHUB_SHA" \
            --target $GITHUB_SHA
