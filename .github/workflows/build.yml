name: Build PS4 SPRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl tar

      - name: Download OpenOrbis SDK (Linux)
        run: |
          mkdir -p $HOME/OO_PS4_TOOLCHAIN
          cd $HOME/OO_PS4_TOOLCHAIN
          URL=$(curl -sL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | grep browser_download_url | grep -E '\.tar\.gz' | head -n 1 | cut -d '"' -f 4)
          echo "URL: $URL"
          [ -n "$URL" ] || { echo "Aucune archive .tar.gz trouvée"; exit 1; }
          curl -sL "$URL" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz
          # Trouve la racine du SDK (dossier contenant include/ et lib/)
          ROOT=$(dirname "$(find $PWD -type f -name link.x | head -n 1)")
          echo "SDK root: $ROOT"
          ls "$ROOT"
          chmod +x "$ROOT"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=$ROOT" >> $GITHUB_ENV

      - name: Debug crtlib
        run: |
          find $OO_PS4_TOOLCHAIN -name "crtlib.c" -exec cat {} \; || true
          ls $OO_PS4_TOOLCHAIN/samples

      - name: Build SPRX
        run: make

      - name: Upload SPRX
        uses: actions/upload-artifact@v4
        with:
          name: mc_lan_proxy_sprx
          path: mc_lan_proxy.sprx
