name: Build PS4 SPRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cmake git unzip wget jq

      - name: Download OpenOrbis SDK (Dynamic API)
        run: |
          mkdir -p $HOME/OO_PS4_TOOLCHAIN
          cd $HOME/OO_PS4_TOOLCHAIN
          
          # Demande à l'API GitHub de trouver automatiquement l'URL du dernier ZIP
          ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases | jq -r '.[].assets[] | select(.name | endswith(".zip")) | .browser_download_url' | head -n 1)
          
          echo "Fichier trouvé ! Téléchargement depuis : $ASSET_URL"
          wget -qO toolchain.zip "$ASSET_URL"
          unzip -q toolchain.zip
          
          # Trouve dynamiquement le bon dossier d'installation du SDK
          TOOL_PATH=$(find $PWD -type d -name "include" | head -n 1 | sed 's|/include||')
          echo "OO_PS4_TOOLCHAIN=$TOOL_PATH" >> $GITHUB_ENV

      - name: Build SPRX
        run: |
          make OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN

      - name: Upload SPRX
        uses: actions/upload-artifact@v4
        with:
          name: mc_lan_proxy_sprx
          path: mc_lan_proxy.sprx
