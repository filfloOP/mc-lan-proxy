name: Build PS4 SPRX

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cmake git unzip

      - name: Download OpenOrbis SDK (Release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $HOME/OO_PS4_TOOLCHAIN
          cd $HOME/OO_PS4_TOOLCHAIN
          
          # Télécharge la dernière archive ZIP officielle pré-compilée
          gh release download -R OpenOrbis/OpenOrbis-PS4-Toolchain --pattern "*.zip"
          unzip *.zip
          
          # Cherche automatiquement le dossier exact contenant "include"
          TOOL_PATH=$(find $PWD -type d -name "include" | head -n 1 | sed 's|/include||')
          echo "OO_PS4_TOOLCHAIN=$TOOL_PATH" >> $GITHUB_ENV

      - name: Build SPRX
        run: |
          make OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN

      - name: Upload SPRX
        uses: actions/upload-artifact@v4
        with:
          name: mc_lan_proxy_sprx
          path: mc_lan_proxy.sprx
